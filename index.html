<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Management System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{

background:#0d1117;
background-image:
radial-gradient(circle at top,#1f2937,#000);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:30px;

}

.container{

width:1000px;

max-width:100%;

background:#161b22;

border-radius:20px;

padding:35px;

box-shadow:0 0 40px rgba(0,255,255,.15);

border:1px solid #30363d;

}

.logo{

width:120px;

height:120px;

margin:auto;

border-radius:50%;

background:linear-gradient(135deg,#00d4ff,#7b2ff7);

display:flex;

justify-content:center;

align-items:center;

font-size:55px;

color:white;

box-shadow:0 0 35px rgba(0,212,255,.5);

animation:float 3s infinite;

}

@keyframes float{

0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}

}

h1{

color:white;

text-align:center;

margin-top:20px;

}

h2{

color:#00d4ff;

text-align:center;

margin:20px 0;

}

.subtitle{

text-align:center;

color:#c9d1d9;

margin-bottom:25px;

}

input,
select{

width:100%;

padding:15px;

margin-top:12px;

background:#0d1117;

color:white;

border:1px solid #30363d;

border-radius:10px;

font-size:16px;

transition:.3s;

}

input:focus,
select:focus{

outline:none;

border-color:#00d4ff;

box-shadow:0 0 12px #00d4ff;

}

button{

width:100%;

padding:15px;

margin-top:15px;

border:none;

border-radius:10px;

font-size:17px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

.green{

background:#00c853;

color:white;

}

.green:hover{

background:#00e676;

transform:translateY(-3px);

}

.blue{

background:#2962ff;

color:white;

}

.blue:hover{

background:#448aff;

transform:translateY(-3px);

}

.logout{

width:auto;

padding:10px 25px;

float:right;

background:#ff1744;

color:white;

}

.logout:hover{

background:#ff4569;

}

.cards{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:20px;

margin:30px 0;

}

.card{

background:#0d1117;

padding:25px;

border-radius:15px;

border:1px solid #30363d;

text-align:center;

transition:.3s;

}

.card:hover{

transform:translateY(-6px);

box-shadow:0 0 20px rgba(0,212,255,.3);

}

.card h3{

color:#8b949e;

margin-bottom:10px;

}

.card h1{

color:#00d4ff;

font-size:38px;

}

.form{

display:grid;

grid-template-columns:1fr 1fr;

gap:15px;

margin-top:25px;

}

table{

width:100%;

margin-top:25px;

border-collapse:collapse;

overflow:hidden;

}

th{

background:#21262d;

color:#00d4ff;

padding:15px;

}

td{

padding:15px;

color:white;

background:#161b22;

border-bottom:1px solid #30363d;

text-align:center;

}

.editBtn{

background:#ffc107;

padding:8px 16px;

border:none;

border-radius:6px;

margin-right:5px;

cursor:pointer;

}

.deleteBtn{

background:#ff1744;

color:white;

padding:8px 16px;

border:none;

border-radius:6px;

cursor:pointer;

}

.deleteAll{

background:#ff1744;

color:white;

}

#welcomePage,
#signupPage,
#loginPage,
#dashboard{

display:none;

}

@media(max-width:768px){

.form{

grid-template-columns:1fr;

}

.cards{

grid-template-columns:1fr;

}

}

</style>

</head>
<body>
    <div class="container">

<!-- ========================= -->
<!-- Welcome Page -->
<!-- ========================= -->

<div id="welcomePage" style="display:block;">

<div class="logo">
🎓
</div>

<h1>Student Management System</h1>

<p class="subtitle">
Welcome to Student Management System
</p>

<p class="subtitle">
Create your account to continue.
</p>

<button class="green" onclick="showSignup()">
🚀 Create Account
</button>

<button class="blue" onclick="showLogin()">
🔐 Login
</button>

</div>

<!-- ========================= -->
<!-- Signup Page -->
<!-- ========================= -->

<div id="signupPage">

<h2>Create Account</h2>

<input
type="text"
id="signupName"
placeholder="👤 Full Name">

<input
type="password"
id="signupPassword"
placeholder="🔒 Password">

<input
type="password"
id="confirmPassword"
placeholder="🔒 Confirm Password">

<button
class="green"
onclick="createAccount()">

Create Account

</button>

</div>

<!-- ========================= -->
<!-- Login Page -->
<!-- ========================= -->

<div id="loginPage">

<h2>Login</h2>

<input
type="text"
id="loginName"
placeholder="👤 Full Name">

<input
type="password"
id="loginPassword"
placeholder="🔒 Password">

<button
class="blue"
onclick="login()">

Login

</button>

</div>

<!-- ========================= -->
<!-- Dashboard -->
<!-- ========================= -->

<div id="dashboard">

<button
class="logout"
onclick="logout()">

Logout

</button>

<h1>
🎓 Student Management System
</h1>

<h2 id="welcomeUser">
Welcome 👋
</h2>

<div class="cards">

<div class="card">

<h3>Total Students</h3>

<h1 id="totalStudents">
0
</h1>

</div>

<div class="card">

<h3>Total Courses</h3>

<h1>
6
</h1>

</div>

<div class="card">

<h3>Status</h3>

<h1 style="color:#00ff88;">
Active
</h1>

</div>

</div>

<input
type="text"
id="search"
placeholder="🔍 Search Student..."
onkeyup="searchStudent()">

<div class="form">

<input
type="text"
id="name"
placeholder="👤 Student Name">

<input
type="number"
id="age"
placeholder="🎂 Student Age">

<select id="course">

<option value="">📚 Select Course</option>

<option>🌐 Web Development</option>

<option>📱 App Development</option>

<option>₿ Crypto</option>

<option>💹 Forex Trading</option>

<option>🤖 AI & Data Science</option>

<option>✨ Prompt Engineering</option>

</select>

<button
id="addBtn"
class="green"
onclick="addStudent()">

➕ Add Student

</button>

</div>

<button
class="deleteAll"
onclick="deleteAllStudents()">

🗑 Delete All Students

</button>

<table>

<thead>

<tr>

<th>Name</th>

<th>Age</th>

<th>Course</th>

<th>Actions</th>

</tr>

</thead>

<tbody id="studentTable">

</tbody>

</table>

</div>

</div>

<script src="app.js"></script>

</body>
</html>
